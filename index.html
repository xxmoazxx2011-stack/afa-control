<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AFA Mission Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: mission-control board — header bar, then ring + "now" grid + lists; member view = one column of timeline + checklists */
:root{
  --bg:#010A1A; --panel:#071631; --panel2:#0B1F42; --line:#17305A; --fg:#F2F6FC; --mut:#9DB0CC;
  --y:#F7C51E; --b:#1E88FF; --t:#19D3A2; --good:#19D3A2; --warn:#F7C51E;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--body);font-size:clamp(14px,1.05vw,19px);line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.wrap{max-width:1680px;margin-inline:auto;display:grid;gap:18px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:12px 18px;border-radius:18px;background:var(--panel);
  border:1px solid var(--line);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(270deg,var(--y),var(--b),var(--t))}
.top img{height:clamp(54px,5vw,84px);border-radius:10px}
.brand{flex:1 1 260px;min-width:0}
.brand h1{font-family:var(--display);font-size:clamp(20px,1.9vw,34px);margin:0;line-height:1.2;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--mut);font-size:.9em}
.clock{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 14px;text-align:center;min-width:120px}
.chip small{display:block;color:var(--mut);font-size:.75em;letter-spacing:.3px}
.chip b{font-family:var(--display);font-size:clamp(18px,1.6vw,30px);font-variant-numeric:tabular-nums}
.chip.hot b{color:var(--y)}
.sim{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85em;color:var(--mut)}
.sim input[type=range]{width:160px;accent-color:var(--y)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.btn.on{background:var(--y);color:#111;border-color:var(--y);font-weight:700}

/* who are you */
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.who h2{grid-column:1/-1;margin:0;font-family:var(--display);font-size:1.15em;color:var(--mut);font-weight:600}
.person{display:grid;gap:6px;text-align:right;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  border-top:5px solid var(--c);transition:transform .15s}
.person:hover{transform:translateY(-2px);border-color:var(--c)}
.person .nm{font-family:var(--display);font-weight:700;font-size:1.15em}
.person .rl{color:var(--mut);font-size:.82em;line-height:1.35}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--t));border-radius:9px;transition:width .5s}
.person .pc{font-family:var(--display);font-size:.85em;color:var(--c)}

/* board */
.board{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.6fr) minmax(260px,1fr);gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 10px;font-family:var(--display);font-size:1.1em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 span{color:var(--mut);font-size:.75em;font-weight:400}
.ringbox{display:grid;place-items:center;gap:10px;text-align:center}
.ring{width:min(100%,300px);aspect-ratio:1;max-width:100%}
.ring text{font-family:var(--display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stats div{background:var(--panel2);border-radius:10px;padding:6px}
.stats b{display:block;font-family:var(--display);font-size:1.3em;font-variant-numeric:tabular-nums}
.stats small{color:var(--mut);font-size:.75em}
.phase{font-family:var(--display);font-size:1.05em;color:var(--y)}

.now{display:grid;gap:10px}
.nowrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;
  background:var(--panel2);border-right:5px solid var(--c)}
.nowrow .who2{font-family:var(--display);font-weight:700}
.nowrow .who2 small{display:block;font-family:var(--body);font-weight:400;color:var(--mut);font-size:.75em}
.nowrow .task{min-width:0}
.nowrow .task small{color:var(--mut);font-size:.8em;font-variant-numeric:tabular-nums}
.pill{font-size:.75em;padding:3px 10px;border-radius:20px;white-space:nowrap;font-weight:700}
.pill.done{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.pill.doing{background:color-mix(in srgb,var(--y) 20%,transparent);color:var(--y)}
.pill.late{background:color-mix(in srgb,#FF5C5C 22%,transparent);color:#FF8A8A}
.pill.idle{background:var(--line);color:var(--mut)}

.slots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.slot{flex:1 1 60px;text-align:center;font-size:.75em;padding:5px 2px;border-radius:8px;background:var(--panel2);color:var(--mut);font-variant-numeric:tabular-nums}
.slot.cur{background:var(--y);color:#111;font-weight:700}
.slot.past{opacity:.45}

.list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start;padding:7px 10px;border-radius:10px;background:var(--panel2);font-size:.92em;line-height:1.45}
.list li .dot{width:11px;height:11px;border-radius:50%;background:var(--c);margin-top:.4em}
.list li small{display:block;color:var(--mut);font-size:.8em}
.list .empty{display:block;color:var(--mut);background:none;padding:4px 0}

/* member view */
.mhead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;border-top:6px solid var(--c)}
.mhead .nm{font-family:var(--display);font-size:clamp(24px,2.4vw,40px);font-weight:700;line-height:1.2}
.mhead .rl{color:var(--mut)}
.mhead .big{flex:1 1 280px}
.mhead .big .bar{height:16px}
.mhead .big .pc{font-family:var(--display);font-size:1.6em;color:var(--c)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.tl{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:right;
  padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid transparent}
.item.cur{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset}
.item .bx{width:26px;height:26px;border-radius:8px;border:2.5px solid var(--c);display:grid;place-items:center;font-weight:700;color:#111}
.item.ok .bx{background:var(--c)}
.item.ok .tx{color:var(--mut);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mut) 60%,transparent)}
.item .tm{font-family:var(--display);font-size:.85em;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.cur .tm{color:var(--y)}
.sub{margin:16px 0 8px;font-family:var(--display);font-size:1em;color:var(--mut)}
.note{font-size:.85em;color:var(--mut);background:var(--panel2);border-radius:10px;padding:8px 12px}
.banner{border:1px solid var(--y);color:var(--y);border-radius:12px;padding:8px 14px;font-size:.9em}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.danger{background:#5c1a1a;border-color:#a33;color:#ffd0d0}

.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.gatebox{width:min(980px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:16px;text-align:center}
.gatebox img{height:86px;margin-inline:auto;border-radius:10px}
.gatebox h2{margin:0;font-family:var(--display);font-size:clamp(22px,2.2vw,36px)}
.gatebox .who{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.gatebox .screen{justify-self:center;background:var(--panel2);border:1px dashed var(--mut);border-radius:12px;padding:10px 18px;color:var(--mut)}
.help{display:flex;align-items:center;gap:10px;justify-content:center;width:100%;padding:12px 16px;border-radius:14px;font-family:var(--display);font-weight:700;
  font-size:1.05em;background:var(--panel2);border:2px solid #E5484D;color:#FF8A8A}
.help.on{background:#E5484D;color:#fff;animation:pulse 1.4s infinite}
.help .hand{font-size:1.5em;line-height:1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}50%{box-shadow:0 0 0 12px rgba(229,72,77,0)}}
.alarm{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 18px;border-radius:16px;background:#E5484D;color:#fff;font-family:var(--display);font-weight:700;
  font-size:clamp(16px,1.4vw,24px);animation:pulse 1.4s infinite}
.alarm .hand{font-size:1.6em}
.alarm .btn{background:#fff;color:#B4232A;border:none;font-size:.7em}
.person.sos{border-color:#E5484D;box-shadow:0 0 0 2px #E5484D}
.nowrow.sos{background:color-mix(in srgb,#E5484D 22%,var(--panel2))}
.pill.grace{background:color-mix(in srgb,#FF9F43 22%,transparent);color:#FFB870}
@media (prefers-reduced-motion:reduce){.help.on,.alarm,.msgpop .gatebox{animation:none}}
.where{font-family:var(--display);color:var(--fg);background:var(--line);border-radius:8px;padding:4px 10px}
.pinned{border-radius:14px;padding:10px 16px;background:color-mix(in srgb,var(--y) 16%,var(--panel));border:1px solid var(--y);font-size:1.05em}
.pinned b{color:var(--y)}
.lastmsg{width:100%;text-align:right;background:var(--panel2);border-right:4px solid var(--y);border-radius:10px;padding:8px 12px;font-size:.92em}
.lastmsg small{display:block;color:var(--mut);font-size:.8em}
.tabs{display:flex;gap:8px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 22px;font-family:var(--display);font-weight:600}
.tab.on{background:var(--y);color:#111;border-color:var(--y)}
.lbl{display:block;color:var(--mut);font-size:.85em;margin-bottom:4px}
textarea,select,input[type=text],input:not([type]){width:100%;font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:10px}
.row>div{flex:1 1 180px;min-width:0}
.row input{flex:1 1 200px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:var(--panel2);border:0;padding:8px 12px}
.seg button.on{background:var(--y);color:#111;font-weight:700}
.seg button.on.urgent{background:#E5484D;color:#fff}
.send{background:var(--t);color:#04221A;border-color:var(--t);font-weight:700;padding:9px 24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:.85em;text-align:right}
.qchip:hover{border-color:var(--y)}
.adm{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;align-items:start}
.admcol{display:grid;gap:18px;min-width:0}
table{width:100%;border-collapse:collapse;font-size:.92em}
th{text-align:right;color:var(--mut);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{border-right:4px solid var(--c)}
.link{background:none;border:0;padding:0;color:var(--fg);font-weight:700;text-decoration:underline;text-decoration-color:var(--line)}
.list .link{color:#FF8A8A;font-weight:400;font-size:1em}
.hreq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#E5484D 22%,var(--panel2));margin-bottom:8px;font-weight:700}
.hreq small{color:var(--mut);font-weight:400}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 4px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow>div:first-child{flex:1 1 240px;min-width:0}
.srow small{display:block;color:var(--mut);font-size:.82em}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{min-width:64px;text-align:center;font-size:1.2em}
.screen.lead{border-style:solid;border-color:var(--y);color:var(--y)}
.msgpop{z-index:60}
.rd{display:block;margin-top:2px}
.msgpop .gatebox{max-width:760px;border:3px solid var(--y);animation:pop .3s ease-out}
.msgpop .gatebox.urgent{border-color:#E5484D;background:color-mix(in srgb,#E5484D 18%,var(--panel))}
.mtag{font-family:var(--display);color:var(--y);font-weight:700}
.urgent .mtag{color:#FF8A8A}
.mtext{font-family:var(--display);font-size:clamp(22px,2.6vw,42px);line-height:1.4;text-wrap:balance}
.msgpop .send{justify-self:center;font-size:1.1em}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:1000px){.adm{grid-template-columns:1fr}}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ins{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:grid;gap:4px;border-right:6px solid var(--k,var(--t))}
.ins small{color:var(--mut);font-size:.8em}
.ins b{font-family:var(--display);font-size:1.15em;line-height:1.35}
.ins .big{font-family:var(--display);font-size:clamp(24px,2.4vw,40px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--k,var(--fg))}
.ins.bad{--k:#FF6B6B}.ins.ok{--k:var(--t)}.ins.warn{--k:#FFB870}.ins.info{--k:var(--y)}
.nextt{display:block;color:var(--mut);font-size:.8em;margin-top:2px}
.nextt b{color:var(--fg);font-weight:600}
.mynow{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mynow .ins b{font-size:1.25em}
.roomchip{font-family:var(--display);background:var(--y);color:#111;border-radius:8px;padding:4px 10px;font-weight:700;direction:ltr}
.roomin{font-size:1.6em;text-align:center;letter-spacing:3px;text-transform:uppercase;max-width:320px;justify-self:center;direction:ltr}

@media (max-width:1100px){.board{grid-template-columns:1fr 1fr}.board .nowcard{grid-column:1/-1;order:-1}}
@media (max-width:760px){.board,.cols{grid-template-columns:1fr}.nowrow{grid-template-columns:1fr auto}.nowrow .task{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function dubai(){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Dubai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(new Date());
  const g=k=>parts.find(x=>x.type===k).value;
  return {date:`${g("year")}-${g("month")}-${g("day")}`,min:(+g("hour")%24)*60+ +g("minute"),sec:+g("second")};
}
function clock(){return sim!==null?{date:DAY,min:sim,sec:0,sim:true}:dubai()}
function phase(c){
  if(c.date<DAY)return "before"; if(c.date>DAY)return "after";
  if(c.min<START())return "pre"; if(c.min>=END())return "after"; return "live";
}

function beep(kind){
  if(!cfg.sound||!ac)return;
  const seq=kind==="urgent"?[[880,0],[660,.18],[880,.36],[660,.54],[988,.72]]:kind==="help"?[[520,0],[520,.25],[520,.5]]:[[784,0],[1047,.16]];
  seq.forEach(([f,t])=>{try{const o=ac.createOscillator(),g=ac.createGain();o.type=kind==="help"?"square":"sine";o.frequency.value=f;
    g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(kind==="urgent"?.5:.3,ac.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.16);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.18)}catch(e){}});
}

async function init(){

    if(!FIREBASE_CONFIG.apiKey||!window.firebase)throw 0;

function connect(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  done={};help={};msgs=[];reads={};toast=[];cfg={...DEF};applyCfg();firstMsgs=true;firstHelp=true;LOADED=Date.now();
  if(!room){render();return}
  if(local||!db){local=true;try{done=JSON.parse(localStorage.getItem(LK("done"))||"{}")}catch(e){};render();return}
  col=db.collection(RP()+"checks"); helpCol=db.collection(RP()+"help"); msgCol=db.collection(RP()+"msgs"); cfgDoc=db.doc(RP()+"config/main"); readCol=db.collection(RP()+"reads");
  unsubs.push(readCol.onSnapshot(s=>{const d={};s.docs.forEach(x=>{const r=x.data();(d[r.msg]=d[r.msg]||[]).push(r.who)});reads=d;render()},()=>{}));
  unsubs.push(cfgDoc.onSnapshot(d=>{cfg={...DEF,...(d.exists?d.data():{})};applyCfg();render()},()=>{}));
  unsubs.push(col.onSnapshot(s=>{const d={};s.docs.forEach(x=>{d[x.id]=x.data()});done=d;render()},()=>{}));
  unsubs.push(helpCol.onSnapshot(s=>{const d={};s.docs.forEach(x=>{d[x.id]=x.data()});
    if(!firstHelp&&TEAM.some(p=>d[p.id]&&d[p.id].on&&!needs(p.id))&&(view==="home"||view==="admin"))beep("help");
    firstHelp=false;help=d;render()},()=>{}));
  unsubs.push(msgCol.orderBy("at","desc").limit(60).onSnapshot(s=>{
    msgs=s.docs.map(x=>({id:x.id,...x.data()}));
    if(!firstMsgs){const fresh=msgs.filter(m=>m.at>LOADED&&!seen[m.id]&&forMe(m)&&!toast.some(t=>t.id===m.id));
      if(fresh.length){toast=toast.concat(fresh.reverse())}}
    firstMsgs=false;render()},()=>{}));
  render();
}

async function wipe(what){
  confirm=null;

function status(t,c){
  if(isDone(t.id))return ["done","تم"];

  if(c.min>=t.e+cfg.grace)return ["late","متأخر"];
  if(c.min>=t.e)return ["grace",`مهلة ${cfg.grace} دقايق`];

}
const hm=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
const hms=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const nowSec=c=>c.min*60+(c.sec||0);
const MILES=[[915,"بطاقة المشروع لازم تتنشر في الجروب"],[960,"أول نسخة من الموقع منشورة على لينك"],[990,"كريم يبعت اللينك و6 سكرينشوتات للكل"],[1050,"كل واحد يرفع النسخة النهائية في Final"],[1065,"التسليم على منصة المسابقة"],[1080,"نهاية المسابقة"]];
const nextMile=c=>MILES.map(([m,t])=>[m+cfg.shift,t]).find(([m])=>m*60>nowSec(c));
function curNext(p,c){
  const ph=phase(c), ref=(ph==="before"||ph==="pre")?START():c.min;

  return [cur,nxt];
}

function insights(c){

function render(){

  if(ringing&&!siren){const go1=()=>beep(toast.some(m=>m.type==="urgent")?"urgent":"normal");go1();siren=setInterval(go1,2200)}
  if(!ringing&&siren){clearInterval(siren);siren=null}

document.addEventListener("click",e=>{
  unlock();
  const q=k=>e.target.closest(k);
  let x;
  if(x=q("[data-go]"))return go(x.dataset.go);
  if(x=q("[data-t]"))return toggle(x.dataset.t);
  if(x=q("[data-help]"))return setHelp(x.dataset.help,!needs(x.dataset.help));
  if(x=q("[data-help-off]"))return setHelp(x.dataset.helpOff,false);
  if(x=q("[data-tab]")){adminTab=x.dataset.tab;confirm=null;return render()}
  if(x=q("[data-mtype]")){drafts.msgType=x.dataset.mtype;return render()}
  if(x=q("[data-q]")){drafts.msgText=QUICK[+x.dataset.q];render();const t=document.getElementById("msgText");if(t)t.focus();return}
  if(x=q("[data-delmsg]")){const id=x.dataset.delmsg;msgs=msgs.filter(m=>m.id!==id);render();if(!local&&msgCol)msgCol.doc(id).delete().catch(()=>{});return}
  if(x=q("[data-shift]"))return saveCfg({shift:Math.max(-30,Math.min(90,cfg.shift+ +x.dataset.shift))});
  if(x=q("[data-grace]"))return saveCfg({grace:Math.max(0,Math.min(20,cfg.grace+ +x.dataset.grace))});
  if(q("[data-sound]"))return saveCfg({sound:!cfg.sound});
  if(q("[data-test]")){const s=cfg.sound;cfg.sound=true;beep("urgent");cfg.sound=s;return}
  if(x=q("[data-ask]")){confirm=x.dataset.ask;return render()}
  if(q("[data-cancel]")){confirm=null;return render()}
  if(x=q("[data-wipe]"))return wipe(x.dataset.wipe);
  const id=e.target.closest("button")?.id;
  if(id==="whobtn"){gate=true;pinAsk=false;return render()}
  if(id==="roombtn"){room="";try{localStorage.removeItem("afa-room")}catch(e){};gate=true;view="home";connect();return}
  if(id==="roomok"){if(!setRoom(drafts.roomIn)){drafts.roomErr=1;render()}else{drafts.roomErr=0;gate=true;render()}return}
  if(id==="roomnew"){drafts.roomIn="AFA-"+Math.floor(1000+Math.random()*9000);render();document.getElementById("roomin")?.focus();return}
  if(id==="homebtn")return go("home");
  if(id==="sndbtn")return saveCfg({sound:!cfg.sound});
  if(id==="adminbtn"){if(isOwner||adminOK){adminOK=true;return go("admin")}pinAsk=true;pinErr=false;render();document.getElementById("pinin")?.focus();return}
  if(id==="pinback"){pinAsk=false;return render()}
  if(id==="pinok")return tryPin();
  if(id==="ack"){const m=toast.shift();if(m){seen[m.id]=1;try{localStorage.setItem("afa-seen",JSON.stringify(seen))}catch(e){}
    if(!local&&readCol){const who=view;readCol.doc(`${m.id}__${who}`).set({msg:m.id,who,at:Date.now()}).catch(()=>{})}}return render()}
  if(id==="sendbtn"){sendMsg(drafts.msgText,drafts.msgTo,drafts.msgType);drafts.msgType="normal";return render()}
  if(id==="pinsave"){saveCfg({pinned:(drafts.pinned??cfg.pinned).trim()});delete drafts.pinned;return}
  if(id==="pinclear"){drafts.pinned="";return saveCfg({pinned:""})}
  if(id==="phonesave"){saveCfg({phone:(drafts.phone??cfg.phone).trim()});delete drafts.phone;return}
  if(id==="pinvsave"){const v=(drafts.pinv??cfg.pin).trim();if(v){saveCfg({pin:v})}delete drafts.pinv;return}
  if(id==="simbtn"){sim=sim===null?START():null;try{localStorage.setItem("afa-sim",sim===null?"":sim)}catch(e){};return render()}
});
function tryPin(){const v=drafts.pinIn||(document.getElementById("pinin")||{}).value||"";if(v.trim()===String(cfg.pin)){adminOK=true;drafts.pinIn="";go("admin")}else{pinErr=true;render();document.getElementById("pinin")?.focus()}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pinin")tryPin();if(e.key==="Enter"&&e.target.id==="roomin")document.getElementById("roomok")?.click()});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="simr"){sim=+t.value;try{localStorage.setItem("afa-sim",sim)}catch(x){};return render()}
  if(t.id==="msgText")drafts.msgText=t.value;
  if(t.id==="msgTo")drafts.msgTo=t.value;
  if(t.id==="pinned")drafts.pinned=t.value;
  if(t.id==="phone")drafts.phone=t.value;
  if(t.id==="pinv")drafts.pinv=t.value;
  if(t.id==="pinin")drafts.pinIn=t.value;
  if(t.id==="roomin")drafts.roomIn=t.value.toUpperCase();
});
document.addEventListener("change",e=>{if(e.target.id==="msgTo")drafts.msgTo=e.target.value});
let tickN=0, lastMin=-1;
function tick(){
  const c=clock(), typing=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!typing&&(c.min!==lastMin||++tickN%15===0)){lastMin=c.min;render();return}
  const cd=cdTarget(c), v=document.getElementById("cdv"); if(cd&&v)v.textContent=hms(cd[0]*60-nowSec(c));
  const k=document.getElementById("clkv"); if(k&&!c.sim)k.innerHTML=`${fmt(c.min)}<span style="font-size:.6em;opacity:.7">:${String(c.sec).padStart(2,"0")}</span>`;
  const ms=document.getElementById("msv"); if(ms)ms.textContent=hms(+ms.dataset.t*60-nowSec(c));
}
setInterval(tick,1000);
applyCfg();
init();
</script>
